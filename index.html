<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiplication Table Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Math Playground</p>
        <h1 id="app-title" class="title">Multiplication Table Generator</h1>
        <p class="subtitle">Choose a number and a range to generate a clean, readable multiplication table instantly.</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
      </header>

      <nav class="quick-links" aria-label="Project links">
        <a href="https://phe0nix.github.io/" class="link-chip">Home</a>
        <a href="https://github.com/Phe0nix/multiplication-table" class="link-chip">View on GitHub</a>
      </nav>

      <form id="table-form" class="controls" novalidate>
        <div class="field-group">
          <label for="base-number">Number</label>
          <input id="base-number" name="baseNumber" type="number" inputmode="numeric" placeholder="e.g. 7" required>
        </div>
        <div class="field-group">
          <label for="limit-number">Range</label>
          <input id="limit-number" name="limitNumber" type="number" inputmode="numeric" min="1" max="100" value="10" required>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Generate</button>
          <button type="button" id="clear-button" class="btn btn-muted">Clear</button>
          <button type="button" id="copy-url-button" class="btn btn-muted">Copy Shareable URL</button>
        </div>
      </form>

      <div id="message" class="message" aria-live="polite"></div>
      <section id="result" class="result" aria-live="polite" aria-label="Generated multiplication table">
        <p class="hint">Your table will appear here.</p>
      </section>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
